trigger: none
pr: none

schedules:
- cron: "0 6 * * *"
  displayName: Daily kernel bump
  branches:
    include:
    - master
  always: true

jobs:
- job: KernelBump
  pool: sonicso1ES-amd64
  timeoutInMinutes: 240
  container:
    image: sonicdev-microsoft.azurecr.io:443/sonic-slave-trixie:master-amd64
  steps:
  - checkout: self
    clean: true
  - script: |
      set -e
      [ -n "$GIT_USER" ] || { echo "GIT_USER not set"; exit 0; }
      BRANCH=kernel-bump/master
      FORK=https://github.com/$GIT_USER/sonic-linux-kernel
      NEW=$(scripts/kernel-bump.sh --latest)
      if git fetch -q $FORK $BRANCH 2>/dev/null && [ "$(git log -1 --format=%s FETCH_HEAD)" = "Linux ${NEW%-*} update" ] &&
         [ "$(git show FETCH_HEAD:kernel-version.mk | sed -n 's/^KERNEL_\(SUB\)\?VERSION ?= //p' | paste -sd-)" = "$NEW" ]; then
        echo "$FORK $BRANCH already has $NEW"
        exit 0
      fi
      git config user.name "$GIT_USER"
      git config user.email "$GIT_USER@users.noreply.github.com"
      BODY=$(Agent.TempDirectory)/body.md
      LOG=$(Agent.TempDirectory)/kernel-bump.log
      RUN=$(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)
      RC=0
      { printf '### Description of PR\n\nSummary:\n'; scripts/kernel-bump.sh "$NEW" 2> $LOG || RC=$?
        cat $LOG >&2
        if [ $RC != 0 ]; then
          printf '\n**kernel-bump.sh exited %s. Triage by hand: [run](%s), full log in its artifacts.**\n' $RC "$RUN"
          printf '\n<details><summary>Log (last 200 lines)</summary>\n\n~~~~\n'; tail -200 $LOG | tail -c 50000; printf '\n~~~~\n\n</details>\n'
        fi
        printf '\n### Type of change\n\n- [x] New feature\n\n### Approach\n#### How did you do it?\n'
        printf 'Generated by .azure-pipelines/kernel-bump.yml (scripts/kernel-bump.sh).\n\n'
        printf '#### How did you verify/test it?\nPR CI: kernel build, VS image, KVM tests.\n'; } > $BODY
      echo "##vso[artifact.upload artifactname=kernel-bump-log]$LOG"
      [ -n "$(git status --porcelain)" ] || exit $RC
      git add -A
      MSG="Linux ${NEW%-*} update"
      [ $RC = 0 ] || [ $RC = 2 ] || MSG="$MSG (run failed, retried daily)"
      git commit -qs -m "$MSG"
      echo 'echo $GIT_PASSWORD' > $(Agent.TempDirectory)/askpass.sh
      chmod +x $(Agent.TempDirectory)/askpass.sh
      GIT_ASKPASS=$(Agent.TempDirectory)/askpass.sh git -c credential.username=$GIT_USER push -f $FORK HEAD:refs/heads/$BRANCH
      command -v gh || sudo apt-get install -y gh
      echo "$GIT_PASSWORD" | gh auth login --with-token
      TITLE="Linux ${NEW%-*} update"
      gh pr create --draft -R $(Build.Repository.Name) -B master -H $GIT_USER:$BRANCH -t "$TITLE" -F $BODY ||
        gh pr edit $GIT_USER:$BRANCH -R $(Build.Repository.Name) -t "$TITLE" -F $BODY
      [ $RC = 0 ] || { echo "##vso[task.logissue type=error]kernel-bump.sh exited $RC for $NEW"; exit 1; }
    env:
      GIT_USER: $(GIT_USER)
      GIT_PASSWORD: $(GIT_PASSWORD)
    displayName: 'Bump kernel and send PR'
