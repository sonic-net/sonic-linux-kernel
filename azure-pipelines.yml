# C/C++ with GCC
# Build your C/C++ project with GCC using make.
# Add steps that publish test results, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/apps/c-cpp/gcc

trigger:
  branches:
    include:
      - "*"
variables:
  - name: BUILD_BRANCH
    ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
      value: $(System.PullRequest.TargetBranch)
    ${{ else }}:
      value: $(Build.SourceBranchName)

stages:
- stage: Build

  jobs:
  - template: .azure-pipelines/build-template.yml
    parameters:
      arch: amd64
      pool: sonicso1ES-amd64
      old_artifact_name: sonic-linux-kernel
      artifact_name: sonic-linux-kernel.amd64
      old_linux_deb_pattern: linux-image-*-unsigned_*deb
      linux_deb_pattern: linux-image-*-unsigned_*deb

  - template: .azure-pipelines/build-template.yml
    parameters:
      arch: amd64
      pool: sonicso1ES-amd64
      old_artifact_name: sonic-linux-kernel
      artifact_name: sonic-linux-kernel.amd64.secure
      old_linux_deb_pattern: linux-image-*-unsigned_*deb
      linux_deb_pattern: linux-image-*-unsigned_*deb
      secure_boot: true

  - job: qemu_ltp_amd64
    displayName: LTP in QEMU (vs-amd64)
    dependsOn: build_vs_amd64_secure_False
    pool: sonicso1ES-amd64
    timeoutInMinutes: 60
    container:
      image: sonicdev-microsoft.azurecr.io:443/sonic-slave-trixie:$(BUILD_BRANCH)-amd64
      options: --privileged
    steps:
    - checkout: self
      clean: true
    - task: DownloadPipelineArtifact@2
      inputs:
        artifact: sonic-linux-kernel.amd64
        itemPattern: linux-image-*-unsigned_*deb
        targetPath: $(Agent.TempDirectory)/kernel
      displayName: "Download the linux-image artifact"
    - script: |
        set -ex
        mkdir -p $(Build.ArtifactStagingDirectory)/ltp
        sudo apt-get update
        sudo apt-get install -y mmdebstrap
        sudo env WORK=$(Agent.TempDirectory)/ltp-work scripts/qemu-ltp.sh \
            $(Agent.TempDirectory)/kernel/linux-image-*-unsigned_*.deb $(Build.ArtifactStagingDirectory)/ltp
      displayName: "Boot the kernel in QEMU and run LTP"
    - publish: $(Build.ArtifactStagingDirectory)/ltp
      artifact: ltp-results.amd64.$(System.JobAttempt)
      displayName: "Archive LTP results"
      condition: always()

  - template: .azure-pipelines/build-template.yml
    parameters:
      arch: arm64
      pool: sonicso1ES-arm64
      old_artifact_name: sonic-linux-kernel.arm64
      artifact_name: sonic-linux-kernel.arm64
      old_linux_deb_pattern: linux-image-*-unsigned_*deb
      linux_deb_pattern: linux-image-*-unsigned_*deb

  - template: .azure-pipelines/build-template.yml
    parameters:
      arch: armhf
      pool: sonicso1ES-armhf
      old_artifact_name: sonic-linux-kernel.armhf
      artifact_name: sonic-linux-kernel.armhf
      old_linux_deb_pattern: linux-image-*-armmp_*deb
      linux_deb_pattern: linux-image-*+deb*-*-armmp_*deb

  - template: .azure-pipelines/build-template.yml
    parameters:
      arch: arm64
      platform: pensando
      pool: sonicso1ES-arm64
      old_artifact_name: sonic-linux-kernel.pensando.arm64
      artifact_name: sonic-linux-kernel.pensando.arm64
      old_linux_deb_pattern: linux-image-*-unsigned_*deb
      linux_deb_pattern: linux-image-*-unsigned_*deb

  - template: .azure-pipelines/build-template.yml
    parameters:
      arch: arm64
      platform: aspeed
      pool: sonicso1ES-arm64
      old_artifact_name: sonic-linux-kernel.aspeed.arm64
      artifact_name: sonic-linux-kernel.aspeed.arm64
      old_linux_deb_pattern: linux-image-*-unsigned_*deb
      linux_deb_pattern: linux-image-*-unsigned_*deb

